{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow mt-4">
            <div class="card-body p-4">
                <h3 class="text-center mb-4">Crear Cuenta</h3>
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Usuario</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Correo electrónico</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Documento</label>
                        <input type="text" name="documento" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Teléfono</label>
                        <input type="text" name="telefono" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Rol</label>
                        <select name="rol" class="form-select" id="rolSelect">
                            <option value="lector">Usuario</option>
                            <option value="administrador">Administrador</option>
                        </select>
                    </div>
                    <div class="mb-3" id="claveAdminDiv" style="display:none;">
                        <label class="form-label">Clave del sistema <span class="text-danger">*</span></label>
                        <input type="password" name="clave_admin" class="form-control" placeholder="Solo para administradores">
                    </div>
                    <button type="submit" class="btn btn-dark w-100">Registrarse</button>
                </form>
                <hr>
                <p class="text-center">¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a></p>
            </div>
        </div>
    </div>
</div>
<script>
    document.getElementById('rolSelect').addEventListener('change', function() {
        const claveDiv = document.getElementById('claveAdminDiv');
        claveDiv.style.display = this.value === 'administrador' ? 'block' : 'none';
    });
</script>
{% endblock %}
