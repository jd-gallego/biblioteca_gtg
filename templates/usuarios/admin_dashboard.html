{% extends 'base.html' %}
{% block content %}
<h2>Panel de Administración</h2>
<hr>
<h4>Usuarios registrados</h4>
<table class="table table-striped">
    <thead>
        <tr>
            <th>Usuario</th>
            <th>Correo</th>
            <th>Rol</th>
            <th>Estado</th>
        </tr>
    </thead>
    <tbody>
        {% for u in usuarios %}
        <tr>
            <td>{{ u.username }}</td>
            <td>{{ u.email }}</td>
            <td>{{ u.rol }}</td>
            <td>{% if u.activo %}Activo{% else %}Inactivo{% endif %}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
